services:
  postgres:
    image: postgres:17-alpine
    container_name: scantaker-postgres
    restart: always
    environment:
      POSTGRES_DB: scantaker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ScantakerSecure2026!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scantaker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scantaker-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scantaker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-ScantakerSecure2026!}
      JWT_SECRET: ${JWT_SECRET:-scantaker-super-secure-production-jwt-key-2026-min32}
      CORS_ORIGINS: "http://localhost:3000,https://*.vercel.app"
      PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:
