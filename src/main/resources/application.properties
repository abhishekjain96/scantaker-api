spring.application.name=scantaker-api

# Database connection - automatically handled by DatabaseConfig.java
# Can be set via DATABASE_URL or SPRING_DATASOURCE_URL / USERNAME / PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/scantaker}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret - 32+ characters
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}
app.jwt.expiry-minutes=1440

# Allowed CORS origins (Supports comma-separated origins)
app.cors.origins=${CORS_ORIGINS:http://localhost:3000,https://scantaker-web.vercel.app,https://*.vercel.app,https://scantaker.com,https://www.scantaker.com}

# Admin seed credentials
app.admin.name=Scantaker Admin
app.admin.mobile=${ADMIN_MOBILE:9999999999}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# Server configuration (Render/Cloud passes PORT environment variable)
server.error.include-message=always
server.port=${PORT:8081}

# Transactional Email (Brevo REST API - Free 300 emails/day)
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from-email=${MAIL_FROM:support@scantaker.com}
app.mail.from-name=${MAIL_FROM_NAME:ScanTaker Diagnostic Network}