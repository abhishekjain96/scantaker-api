spring.application.name=scantaker-api-test
spring.datasource.url=jdbc:h2:mem:scantaker_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
app.upload.dir=./target/test-uploads
app.jwt.secret=test-only-jwt-secret-key-at-least-32-characters-long
app.jwt.expiry-minutes=43200
app.cors.origins=http://localhost:3000,https://scantaker.com
app.admin.name=Scantaker Admin
app.admin.mobile=9999999999
app.admin.password=Admin@12345
app.mail.brevo-api-key=
app.mail.from-email=support@scantaker.com
app.mail.from-name=ScanTaker Diagnostic Network
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
